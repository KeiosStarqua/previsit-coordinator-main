# --- SQLite datasource -------------------------------------------------------
# The database lives in a single file (previsit.db) created next to where the
# app is started. It records user accounts and their coordination activity.
spring.datasource.url=jdbc:sqlite:previsit.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer at a time; keep the pool small and serialize.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=previsit-sqlite

# Create the schema on startup if the tables are not present.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Session cookie hardening for the demo login.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# --- Email (Resend) for signup OTP -------------------------------------------
# Set RESEND_API_KEY in the environment (or .env). If blank, OTP emails are not
# sent and the code is surfaced in dev mode instead (see otp.dev-echo).
resend.api-key=${RESEND_API_KEY:}
# Verified "from" address. Resend's shared onboarding@resend.dev only delivers to
# the Resend account owner's own email; use a verified domain for real delivery.
resend.from=${RESEND_FROM:PreVisit Coordinator <onboarding@resend.dev>}
# When true and no key is configured, the code is returned in the API response so
# the flow can be demoed without a real inbox. Turn OFF for production.
otp.dev-echo=${OTP_DEV_ECHO:true}

# Expose the exception reason in error responses so the dashboard can show
# specific messages (e.g. "Password must be at least 6 characters") and so
# the login flow can detect an unverified account (ACCOUNT_PENDING_VERIFICATION).
server.error.include-message=always
